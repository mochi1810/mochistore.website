<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mochi Store 🌸</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🌸 Mochi Store 🌸</h1>
        <p>Top Up, App Premium & Sosmed</p>
    </header>
    <div class="container">
        <div class="card">
            <b>🎮 Top Up Game (Otomatis WA)</b>
            <input type="text" id="uid" placeholder="Masukkan ID Game...">
            <button onclick="orderWA('topup')">Pesan via WA 💬</button>
        </div>
        <div class="card">
            <b>✨ App Premium</b>
            <select id="app">
                <option value="Netflix">Netflix 1 Bulan (Stok: Tersedia)</option>
                <option value="Spotify">Spotify 1 Bulan (Stok: Tersedia)</option>
            </select>
            <button onclick="orderWA('app')">Beli via WA 💬</button>
        </div>
        <div class="card">
            <b>🚀 Suntik Sosmed (Sistem API)</b>
            <input type="text" id="target" placeholder="Username Target...">
            <button onclick="orderAPI()">Proses Suntik 💉</button>
            <p id="status" style="color: #ff69b4; font-weight: bold; margin-top: 10px;"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
