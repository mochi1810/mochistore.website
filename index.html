<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mochi Store 🌸</title>
    
    <!-- Mengimpor Font Lucu dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        /* Animasi Latar Belakang Bergerak */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Animasi Muncul dari Bawah */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Animasi Mengapung Halus */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        body {
            font-family: 'Quicksand', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(-45deg, #ffe5ec, #ffb6c1, #ffc0cb, #f8bbd0);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite; /* Efek Latar Bergerak */
            color: #5d4037;
        }

        header {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            padding: 30px 20px;
            text-align: center;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            box-shadow: 0 10px 20px rgba(255, 105, 180, 0.1);
            border-bottom: 3px solid #ffb6c1;
            animation: fadeInUp 0.8s ease-out;
        }

        header h1 {
            font-family: 'Baloo 2', cursive;
            color: #ff4081;
            margin: 0;
            font-size: 2.8em;
            text-shadow: 2px 2px 0px #fff, 4px 4px 10px rgba(255, 64, 129, 0.3);
            letter-spacing: 1px;
        }

        header p {
            margin-top: 5px;
            font-weight: 700;
            color: #d81b60;
            font-size: 1.1em;
        }

        .container {
            max-width: 500px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(5px);
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 25px;
            box-shadow: 0 8px 25px rgba(255, 182, 193, 0.4);
            border: 3px dashed #ffb6c1;
            animation: fadeInUp 0.8s ease-out forwards, float 4s ease-in-out infinite;
            opacity: 0; /* Untuk animasi awal */
        }

        /* Mengatur jeda animasi agar kotak muncul bergantian */
        .card:nth-child(1) { animation-delay: 0.2s, 0s; }
        .card:nth-child(2) { animation-delay: 0.4s, 1s; }
        .card:nth-child(3) { animation-delay: 0.6s, 2s; }

        .card b {
            font-family: 'Baloo 2', cursive;
            font-size: 1.3em;
            color: #e91e63;
            display: block;
            margin-bottom: 15px;
            text-align: center;
        }

        input, select {
            width: 100%;
            padding: 14px;
            margin: 10px 0 15px;
            border-radius: 15px;
            border: 2px solid #ffb6c1;
            box-sizing: border-box;
            outline: none;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            color: #555;
            background: #fff9fa;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            border-color: #ff4081;
            background: #fff;
            box-shadow: 0 0 10px rgba(255, 64, 129, 0.2);
        }

        button {
            width: 100%;
            background: linear-gradient(45deg, #ff4081, #ff79b0);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Baloo 2', cursive;
            font-size: 1.2em;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(255, 64, 129, 0.4);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        button:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 64, 129, 0.6);
        }

        button:active {
            transform: scale(0.95);
        }

        .status-text {
            text-align: center;
            color: #d81b60;
            font-weight: bold;
            margin-top: 15px;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌸 Mochi Store 🌸</h1>
        <p>✨ Top Up, App Premium & Sosmed ✨</p>
    </header>

    <div class="container">
        <!-- Card Top Up -->
        <div class="card">
            <b>🎮 Top Up Game (Auto WA)</b>
            <select id="game">
                <option value="Mobile Legends">Mobile Legends</option>
                <option value="Free Fire">Free Fire</option>
            </select>
            <input type="text" id="uid" placeholder="ID Game kamu...">
            <button onclick="orderWA('topup')">Pesan via WA 💬</button>
        </div>

        <!-- Card App Premium -->
        <div class="card">
            <b>💖 Aplikasi Premium</b>
            <select id="app">
                <option value="Netflix 1 Bulan">Netflix 1 Bulan (Tersedia)</option>
                <option value="Spotify 1 Bulan">Spotify 1 Bulan (Tersedia)</option>
                <option value="Canva Pro 1 Tahun">Canva Pro 1 Tahun (Tersedia)</option>
            </select>
            <button onclick="orderWA('app')">Beli via WA 💬</button>
        </div>

        <!-- Card Suntik Sosmed -->
        <div class="card">
            <b>🚀 Suntik Sosmed (Sistem API)</b>
            <select id="sosmed">
                <option value="Followers IG">Followers Instagram</option>
                <option value="Views TikTok">Views TikTok</option>
            </select>
            <input type="text" id="target" placeholder="Username / Link Target...">
            <button onclick="orderAPI()">Proses Suntik 💉</button>
            <div id="status" class="status-text"></div>
        </div>
    </div>

    <script>
        const waNumber = "6281234567890"; // Ganti dengan nomor WhatsApp kamu
        
        function orderWA(type) {
            let text = "";
            if (type === 'topup') {
                const game = document.getElementById('game').value;
                const uid = document.getElementById('uid').value;
                if(!uid) return alert("Hayo, ID Game-nya jangan lupa diisi ya! 🌸");
                text = `Halo Mochi Store! 🌸%0A%0AAku mau order Top Up nih:%0A🎮 Game: ${game}%0A🆔 ID: ${uid}%0A%0AMinta list harga dan qrisnya ya kak! ✨`;
            } else if (type === 'app') {
                const app = document.getElementById('app').value;
                text = `Halo Mochi Store! 🌸%0A%0AAku mau order Aplikasi Premium:%0A💖 App: ${app}%0A%0AMinta nomer dana atau qrisnya ya kak! ✨`;
            }
                
            window.open(`https://wa.me/${waNumber}?text=${text}`, '_blank');
        }

        function orderAPI() {
            const target = document.getElementById('target').value;
            const sosmed = document.getElementById('sosmed').value;
            const statusText = document.getElementById('status');
            
            if(!target) {
                statusText.innerText = "❌ Username target belum diisi kak!";
                return;
            }
            
            statusText.innerText = "⏳ Sedang menghubungi server Mochi...";
            statusText.style.color = "#ff9800"; // Warna oranye saat loading
            
            // Simulasi proses API (Ganti bagian ini dengan Fetch API backend Node.js kamu nantinya)
            setTimeout(() => {
                statusText.innerText = `✅ Berhasil! ${sosmed} sedang diproses.`;
                statusText.style.color = "#e91e63"; // Kembali ke pink pekat
            }, 2000);
        }
    </script>
</body>
</html>
